name: Deploy the Canton Fair kiosk to GitHub Pages (cf.hosun.cn)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Only the Canton Fair kiosk is published, at the root of cf.hosun.cn.
      # b2b/, b2c/ and demo/ stay in the repository but are not deployed yet;
      # to bring one back, copy it into _site/ here (it will appear under the
      # same domain). The custom domain is set in the repository's Pages
      # settings — with an Actions deploy, a CNAME file in _site/ is ignored.
      - name: Assemble the Canton Fair kiosk
        run: |
          mkdir -p _site
          cp -R fair/. _site/
          rm -rf _site/tools _site/README.md
          find _site -name .DS_Store -delete

      - name: Upload the kiosk
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
